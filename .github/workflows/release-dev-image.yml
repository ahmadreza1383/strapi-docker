name: Release Dev Docker Image

on:
  workflow_dispatch:
    inputs:
      strapi_version:
        description: 'Strapi version (e.g., latest, v5.45.0, v5.48.0)'
        required: true
        default: 'latest'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.dev'
      - '.github/workflows/release-dev-image.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Release Strapi Docker Image
        uses: ./.github/actions/release-strapi-image
        with:
          strapi_version: ${{ github.event.inputs.strapi_version || 'latest' }}
          dockerfile: ./Dockerfile.dev
          image_name: strapi-base-dev
